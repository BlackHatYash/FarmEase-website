    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FarmEase - Smart Farming Assistant</title>
    <script type="text/javascript">
      // Redirect 404s to index.html for single page app routing on GitHub Pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/index.html'
      );
    </script>
  </head>
